<title>Θεσσαλία Layers Agent</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@500;650;800&family=Fira+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://unpkg.com/deck.gl@8.9.35/dist.min.js"></script>
<script src="https://unpkg.com/h3-js@4.1.0/dist/h3-js.umd.js"></script>
<style>
/* Layout: map-first operations room. Map fills the screen; the agent works in a docked right panel;
   one quiet bar on top, a mode switch + legend bottom-left. Single deliberate dark look (night survey table). */
:root {
  --bg: #0D1522; --panel: #121D2E; --panel2: #172539; --ink: #E7ECF3; --muted: #8C9BB0; --line: #233149;
  --sun: #F2A33A; --water: #4FA3E0; --scenario: #9A86EE; --ok: #5CC28E; --warn: #E9B44C; --bad: #E2675A;
  --display: "Commissioner", "Fira Sans", system-ui, sans-serif;
  --body: "Fira Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.45; overflow: hidden; }
.app { position: fixed; inset: 0; display: grid; grid-template-columns: 1fr minmax(340px, 420px); }
.stage { position: relative; min-width: 0; overflow: hidden; }
#map, #map2 { position: absolute; inset: 0; }
#map2 { clip-path: inset(0 0 0 50%); }
#map2[hidden] { display: none; }

.topbar { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); right: 16px;
  display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; pointer-events: none; z-index: 3; }
.brand { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: -.01em; }
.brand span { color: var(--sun); }
.stats { font-family: var(--mono); font-size: 11.5px; color: var(--muted); letter-spacing: .02em; }

.dock { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: grid; gap: 10px; z-index: 3; max-width: min(460px, calc(100% - 32px)); }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; width: max-content; }
.seg button { font: 500 12.5px var(--body); color: var(--muted); background: none; border: 0; padding: 7px 14px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--panel2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.seg button:focus-visible, button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }
.legend { background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; }
.legend .ramp { height: 8px; border-radius: 4px; }
.lab { display: flex; justify-content: space-between; font: 11px var(--mono); color: var(--muted); }
.legend .t { font-size: 12px; color: var(--ink); }

.swipe-ui[hidden] { display: none; }
.divider { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: var(--ink); z-index: 4; cursor: ew-resize; touch-action: none; }
.divider::after { content: "⟷"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--ink); color: var(--bg);
  font-size: 14px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; }
.tag { position: absolute; top: calc(58px + env(safe-area-inset-top, 0px)); z-index: 4; font: 600 12px var(--body); padding: 6px 10px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line); max-width: 42%; }
.tag.l { left: 16px; border-left: 3px solid var(--water); }
.tag.r { right: 16px; border-left: 3px solid var(--scenario); }
.tag small { display: block; font: 400 11px var(--mono); color: var(--muted); }

/* panel */
aside { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; min-height: 0;
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-left: 16px; }
.scroll { overflow-y: auto; display: grid; gap: 16px; align-content: start; min-height: 0; padding-right: 4px; }
.eyebrow { font: 600 10.5px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.ask { display: grid; gap: 8px; }
.ask textarea { width: 100%; box-sizing: border-box; resize: none; min-height: 64px; background: var(--bg); color: var(--ink); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px; font: 14px var(--body); }
.ask .row { display: flex; gap: 8px; align-items: center; }
.btn { font: 600 13px var(--body); background: var(--sun); color: #1B1408; border: 0; border-radius: 8px; padding: 9px 14px; cursor: pointer; }
.btn[disabled] { opacity: .5; cursor: progress; }
.btn.ghost { background: none; color: var(--muted); border: 1px solid var(--line); }
.status { font: 12px var(--mono); color: var(--muted); min-height: 1em; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 12.5px var(--body); color: var(--ink); background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 6px 11px; cursor: pointer; text-align: left; }
.chip:hover { border-color: var(--sun); }

.result { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 14px; }
.result h2 { font: 650 17px/1.25 var(--display); margin: 0; text-wrap: balance; }
.answer { color: var(--ink); margin: 0; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpi { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.kpi b { display: block; font: 600 18px var(--mono); font-variant-numeric: tabular-nums; }
.kpi span { font-size: 11px; color: var(--muted); }

.funnel { display: grid; gap: 4px; }
.step { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 8px; }
.step:hover { background: var(--panel2); }
.step input { accent-color: var(--sun); width: 16px; height: 16px; margin: 0; }
.step .lbl { min-width: 0; }
.step .lbl div { font-size: 13px; }
.step .lbl small { font: 10.5px var(--mono); color: var(--muted); }
.step .num { font: 600 12.5px var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
.step .bar { grid-column: 2 / 4; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.step .bar i { display: block; height: 100%; background: var(--sun); transition: width .6s ease; }
.step.off { opacity: .45; }
.step.off .bar i { background: var(--muted); }

.weights { display: grid; gap: 8px; }
.w { display: grid; grid-template-columns: 1fr 90px 28px; gap: 8px; align-items: center; font-size: 12.5px; }
.w input { width: 100%; accent-color: var(--sun); }
.w output { font: 11px var(--mono); color: var(--muted); text-align: right; }

.caveat { border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--line)); background: color-mix(in srgb, var(--warn) 7%, var(--panel)); border-radius: 8px; padding: 9px 11px; font-size: 12.5px; display: grid; gap: 4px; }
.caveat b { color: var(--warn); font-weight: 600; }
.refuse { border-color: color-mix(in srgb, var(--bad) 50%, var(--line)); background: color-mix(in srgb, var(--bad) 8%, var(--panel)); }
.refuse b { color: var(--bad); }
details { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
summary { cursor: pointer; font-size: 12.5px; color: var(--muted); }
pre { font: 11px/1.5 var(--mono); color: var(--muted); white-space: pre-wrap; word-break: break-word; margin: 8px 0 0; max-height: 240px; overflow: auto; }
.src { display: flex; flex-wrap: wrap; gap: 5px; }
.badge { font: 10.5px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px; }

.card { position: absolute; z-index: 5; right: 16px; top: calc(56px + env(safe-area-inset-top, 0px)); width: min(300px, calc(100% - 32px)); background: var(--panel);
  border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; box-shadow: 0 12px 40px rgb(0 0 0 / .35); }
.card[hidden] { display: none; }
.card h3 { margin: 0; font: 650 14px var(--display); }
.card dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; font-size: 12px; }
.card dt { color: var(--muted); }
.card dd { margin: 0; font: 12px var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.card .x { position: absolute; top: 8px; right: 10px; background: none; border: 0; color: var(--muted); font-size: 18px; cursor: pointer; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font: 13px var(--mono); z-index: 2; }


.layers { position: absolute; z-index: 3; left: max(16px, env(safe-area-inset-left, 0px)); top: calc(56px + env(safe-area-inset-top, 0px)); width: 236px;
  background: color-mix(in srgb, var(--panel) 94%, transparent); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.layers[hidden] { display: none; }
.layers summary { font: 600 10.5px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
#layersList { display: grid; gap: 2px; margin-top: 6px; }
.lyr { display: grid; grid-template-columns: 16px 1fr; gap: 4px 8px; align-items: center; padding: 4px 2px; font-size: 12.5px; cursor: pointer; }
.lyr input[type=checkbox] { accent-color: var(--sun); margin: 0; }
.lyr small { display: block; font: 10px var(--mono); color: var(--muted); }
.lyr input[type=range] { grid-column: 2; width: 100%; accent-color: var(--sun); height: 14px; margin: 0; }
.lyr.ex { grid-template-columns: 1fr 70px 34px; border-top: 1px solid var(--line); margin-top: 4px; padding-top: 8px; }
.lyr.ex input[type=range] { grid-column: auto; }
.lyr output { font: 11px var(--mono); color: var(--muted); }
.tl { background: color-mix(in srgb, var(--panel) 94%, transparent); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; }
.tl[hidden] { display: none; }
.tlhead { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.tlhead b { font: 650 18px var(--display); }
.tlhead span { font: 600 13px var(--mono); color: var(--water); }
.tlrow { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; }
.tlrow input { width: 100%; accent-color: var(--water); }
.big { color: var(--sun); font: 600 20px var(--mono); }
@media (max-width: 820px) { .layers { width: 200px; top: auto; bottom: 16px; left: auto; right: 16px; } .layers:not([open]) { width: auto; } }
@media (max-width: 820px) {
  body { overflow: auto; }
  .app { position: static; display: block; }
  .stage { height: 62vh; }
  aside { border-left: 0; border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  .tag { max-width: 40%; font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) { .step .bar i { transition: none; } }
</style>

<div class="app">
  <div class="stage" id="stage">
    <div id="map"></div>
    <div id="map2" hidden></div>
    <div class="loading" id="loading">Φόρτωση 17.504 εξαγώνων…</div>
    <div class="topbar">
      <div class="brand">Θεσσαλία <span>·</span> Layers Agent</div>
      <div class="stats" id="stats">H3 res 8 · 17.504 κελιά · 14.053 km² · 40+ layers</div>
    </div>
    <div class="swipe-ui" id="swipeUI" hidden>
      <div class="divider" id="divider" role="separator" aria-label="Σύρε για σύγκριση" tabindex="0"></div>
      <div class="tag l">Πλημμύρα Daniel, Σεπ. 2023<small>Copernicus EMS EMSR692 · παρατήρηση</small></div>
      <div class="tag r">Αν έκλειναν τα Τέμπη<small>σενάριο από DEM · στάθμη 121,6 m</small></div>
    </div>
    <div class="card" id="card" hidden></div>
    <details class="layers" open>
      <summary>Layers</summary>
      <div id="layersList"></div>
      <label class="lyr ex" for="exag"><span><span>Υπερβολή ύψους</span><small>Copernicus DEM</small></span><input type="range" id="exag" min="1" max="5" step="0.5" value="2.5"><output id="exagOut">×2,5</output></label>
    </details>
    <div class="dock">
      <div class="seg" role="group" aria-label="Λειτουργία">
        <button id="mode-query" aria-pressed="true">Ερώτημα</button>
        <button id="mode-time" aria-pressed="false">Daniel μέρα-μέρα</button>
        <button id="mode-swipe" aria-pressed="false">Daniel ↔ Τέμπη</button>
      </div>
      <div class="tl" id="tlUI" hidden>
        <div class="tlhead"><b id="tlDate"></b><span id="tlKm"></span></div>
        <div class="tlrow"><button class="btn" id="tlPlay">▶ Αναπαραγωγή</button><input type="range" id="tlRange" min="0" max="11" step="1" value="3" aria-label="Ημερομηνία"></div>
        <div class="lab" id="tlAoi"></div>
        <div class="lab">Πηγή: Copernicus EMS EMSR692, 12 ημερομηνίες λήψης 6–22 Σεπ 2023</div>
      </div>
      <div class="legend" id="legend"></div>
    </div>
  </div>

  <aside>
    <div class="scroll">
      <div class="ask">
        <label class="eyebrow" for="q">Ρώτα τα layers</label>
        <textarea id="q" rows="3" placeholder="π.χ. Πού υπάρχουν κατοικημένες περιοχές κάτω από 100 m που πλημμύρισαν το 2023;"></textarea>
        <div class="row">
          <button class="btn" id="askBtn">Ρώτα</button>
          <button class="btn ghost" id="stopBtn" hidden>Διακοπή</button>
          <span class="status" id="status"></span>
        </div>
        <div class="presets" id="presets"></div>
      </div>
      <section class="result" id="result" aria-live="polite"></section>
    </div>
  </aside>
</div>

<script>
// ---------- column catalog (shared with the agent prompt) ----------
const CAT = {
  elev:   {l:"Υψόμετρο", u:"m", src:"Copernicus GLO-90", d:"μέσο υψόμετρο κελιού"},
  slope:  {l:"Κλίση", u:"°", src:"GLO-90", d:"μέση κλίση"},
  flat:   {l:"Επίπεδο τμήμα", u:"0-1", src:"GLO-90", d:"μερίδιο με κλίση <5°"},
  south:  {l:"Νότιος προσανατολισμός", u:"0-1", src:"GLO-90", d:"μερίδιο με νότια έκθεση"},
  crop:   {l:"Καλλιέργειες", u:"0-1", src:"ESA WorldCover 2021", d:"μερίδιο αγροτικής γης"},
  tree:   {l:"Δέντρα", u:"0-1", src:"WorldCover 2021", d:"δασική/δενδρώδης κάλυψη (και οπωρώνες)"},
  grass:  {l:"Λιβάδια", u:"0-1", src:"WorldCover 2021", d:"χορτολίβαδα"},
  built:  {l:"Δομημένο", u:"0-1", src:"WorldCover 2021", d:"δομημένη επιφάνεια"},
  water:  {l:"Νερό", u:"0-1", src:"WorldCover 2021", d:"μόνιμο νερό"},
  pop:    {l:"Πληθυσμός", u:"άτομα", src:"Kontur 2023", d:"κάτοικοι στο κελί (μοντέλο, όχι απογραφή)"},
  flood:  {l:"Πλημμύρα Daniel", u:"0-1", src:"Copernicus EMS EMSR692, Σεπ 2023", d:"μερίδιο κελιού που πλημμύρισε (ένα γεγονός, όχι χάρτης κινδύνου)"},
  mapped: {l:"Χαρτογραφήθηκε για Daniel", u:"0-1", src:"EMSR692", d:"μερίδιο εντός περιοχών χαρτογράφησης· 0 = άγνωστο"},
  floodn: {l:"Επιμονή πλημμύρας", u:"προϊόντα", src:"EMSR692", d:"σε πόσα δορυφορικά προϊόντα/ημερομηνίες ήταν πλημμυρισμένο"},
  lake:   {l:"Λίμνη Τεμπών (σενάριο)", u:"0-1", src:"DEM, σενάριο day 15", d:"μερίδιο κάτω από τη στάθμη 121,6 m αν έκλειναν τα Τέμπη· υποθετικό"},
  lakedepth:{l:"Βάθος λίμνης (σενάριο)", u:"m", src:"DEM", d:"υποθετικό βάθος"},
  natura: {l:"Natura 2000", u:"0-1", src:"EEA Natura 2000", d:"μερίδιο σε περιοχή Natura (SCI/SAC/SPA)"},
  dsub:   {l:"Απόσταση από υποσταθμό", u:"km", src:"OSM (Overture 2026-10)", d:"OSM, ελλιπές: 71 υποσταθμοί"},
  dline:  {l:"Απόσταση από γραμμή ΥΤ", u:"km", src:"OSM", d:"γραμμές μεταφοράς, τάση άγνωστη"},
  droad:  {l:"Απόσταση από άσφαλτο", u:"km", src:"OSM", d:"πλησιέστερος μη χωματόδρομος"},
  dmajor: {l:"Απόσταση από κύριο δρόμο", u:"km", src:"OSM", d:"motorway–secondary"},
  solar:  {l:"Φωτοβολταϊκά", u:"0-1", src:"OSM power=plant solar", d:"μερίδιο κελιού με φωτοβολταϊκό πάρκο"},
  dsolar: {l:"Απόσταση από ΦΒ πάρκο", u:"km", src:"OSM", d:"πλησιέστερο φωτοβολταϊκό"},
  thr:    {l:"Απειλούμενα είδη (καταγραφές)", u:"πλήθος", src:"GBIF, IUCN CR/EN/VU", d:"δείχνει πού κοίταξαν παρατηρητές"},
  thrsp:  {l:"Απειλούμενα είδη", u:"πλήθος", src:"GBIF", d:"διαφορετικά είδη"},
  track:  {l:"Χωματόδρομοι", u:"km", src:"OSM", d:"μήκος track στο κελί"},
  ru:     {l:"Περιφερειακή ενότητα", u:"0/1/2", src:"Eurostat NUTS-3", d:"0=Λάρισα, 1=Καρδίτσα+Τρίκαλα, 2=Μαγνησία+Σποράδες"},
};
const RU = ["Λάρισα", "Καρδίτσα & Τρίκαλα", "Μαγνησία & Σποράδες"];
const OPS = { "<": (a,b)=>a<b, "<=": (a,b)=>a<=b, ">": (a,b)=>a>b, ">=": (a,b)=>a>=b, "==": (a,b)=>a==b, "!=": (a,b)=>a!=b };

const PRESETS = [
  { q: "Επίπεδη αγροτική γη εκτός Natura, που δεν πλημμύρισε, κοντά σε υποσταθμό (agrivoltaics)",
    spec: { title: "Πρώτο φίλτρο για agrivoltaics", answer: "Επίπεδα χωράφια εκτός Natura 2000, εκτός της πλημμύρας του Daniel και έως 5 km από υποσταθμό, βαθμολογημένα για σύνδεση και πρόσβαση.",
      filters: [
        {col:"slope", op:"<", value:5, label:"Κλίση κάτω από 5°"},
        {col:"crop", op:">", value:0.5, label:"Κυρίως καλλιέργειες"},
        {col:"built", op:"<", value:0.1, label:"Όχι δομημένο"},
        {col:"natura", op:"<", value:0.05, label:"Εκτός Natura 2000"},
        {col:"flood", op:"<", value:0.05, label:"Δεν πλημμύρισε το 2023"},
        {col:"dsub", op:"<", value:5, label:"Έως 5 km από υποσταθμό"}],
      score: [{col:"dsub", dir:"low", cap:5, w:0.5, label:"Κοντά σε υποσταθμό"}, {col:"droad", dir:"low", cap:2, w:0.2, label:"Κοντά σε άσφαλτο"},
              {col:"south", dir:"high", cap:1, w:0.1, label:"Νότια έκθεση"}, {col:"crop", dir:"high", cap:1, w:0.2, label:"Μερίδιο καλλιεργειών"}],
      caveats: ["Λείπουν: χωρητικότητα δικτύου (κορεσμός), κτηματολόγιο, τιμές γης, επίσημοι χάρτες κινδύνου πλημμύρας.", "Οι υποσταθμοί είναι από OSM (71 στη Θεσσαλία) και πιθανώς ελλιπείς."] } },
  { q: "Κατοικημένες περιοχές που πλημμύρισαν από τον Daniel",
    spec: { title: "Ποιοι ζουν μέσα στην πλημμύρα του Daniel", answer: "Κελιά με κατοίκους όπου πάνω από το 20% πλημμύρισε τον Σεπτέμβριο 2023. Το ύψος δείχνει πόσο επέμεινε το νερό.",
      filters: [{col:"pop", op:">", value:0, label:"Έχει κατοίκους"}, {col:"flood", op:">", value:0.2, label:"Πάνω από 20% πλημμυρισμένο"}],
      score: [{col:"floodn", dir:"high", cap:6, w:0.6, label:"Ημέρες/προϊόντα με νερό"}, {col:"pop", dir:"high", cap:500, w:0.4, label:"Πληθυσμός"}],

function catalogText() { return Object.entries(CAT).map(([k, c]) => `${k}: ${c.l} [${c.u}] — ${c.d} (πηγή: ${c.src})`).join("\n"); }
function promptFor(q) {
  return `Είσαι ο agent ενός εργαλείου που απαντά ερωτήσεις για τη Θεσσαλία συνδυάζοντας χωρικά layers. Τα δεδομένα είναι ένας πίνακας με 17.504 εξάγωνα H3 (~0,74 km² το καθένα), με αυτές τις στήλες:\n\n${catalogText()}\n\nΜετέτρεψε την ερώτηση του χρήστη σε προδιαγραφή φίλτρων. ΔΕΝ υπολογίζεις αποτελέσματα· η σελίδα εφαρμόζει τα φίλτρα.\nΚανόνες:\n- Χρησιμοποίησε ΜΟΝΟ τις παραπάνω στήλες. Μερίδια είναι 0-1.\n- Αν η ερώτηση χρειάζεται δεδομένα που δεν υπάρχουν (π.χ. τιμές γης, κτηματολόγιο, χωρητικότητα δικτύου, μελλοντικός κίνδυνος, ονόματα χωριών), απάντησε {"refuse": "<εξήγηση στα ελληνικά τι λείπει>"}.\n- Το 'lake' είναι υποθετικό σενάριο και το 'flood' ένα ιστορικό γεγονός: ανέφερέ το στα caveats όταν τα χρησιμοποιείς.\n- 2 έως 7 φίλτρα, με σύντομες ελληνικές ετικέτες.\n\nΑπάντησε ΜΟΝΟ με JSON αυτής της μορφής:\n{"title": "...", "answer": "1-2 προτάσεις τι δείχνει ο χάρτης", "filters": [{"col": "slope", "op": "<", "value": 5, "label": "Κλίση κάτω από 5°"}], "score": [{"col": "dsub", "dir": "low", "cap": 5, "w": 0.5, "label": "Κοντά σε υποσταθμό"}], "caveats": ["..."]}\nop ∈ <, <=, >, >=, ==, !=. dir ∈ low, high. cap = τιμή όπου ο όρος κορεστεί.\n\nΕρώτηση: ${q}`;
}
async function ask() {
  const q = $("q").value.trim(); if (!q) return;
  if (!sample) { $("status").textContent = "Ο ζωντανός agent δεν είναι διαθέσιμος εδώ· δοκίμασε ένα από τα έτοιμα ερωτήματα."; return; }
  ctl = new AbortController(); $("askBtn").disabled = true; $("stopBtn").hidden = false; $("status").textContent = "Ο agent σκέφτεται…";
  try {
    const s = await sample.json(promptFor(q), { signal: ctl.signal, modelTier: "quick" });
    if (!s || (typeof s !== "object")) throw { code: "invalid_json" };
    apply(s, "live", true); $("status").textContent = "";
  } catch (e) {
    const m = { cancelled: "", not_granted: "Δεν επιτράπηκε η χρήση του Claude από τη σελίδα.", rate_limited: "Πολλά αιτήματα· δοκίμασε σε λίγο.",
      invalid_json: "Ο agent δεν επέστρεψε έγκυρη προδιαγραφή· ξαναδοκίμασε ή απλοποίησε την ερώτηση.", sampling_disabled: "Το Claude δεν είναι διαθέσιμο για αυτόν τον λογαριασμό." };
    $("status").textContent = m[e.code] ?? "Κάτι πήγε στραβά· ξαναδοκίμασε.";
    if (e.code === "not_granted" || e.code === "sampling_disabled") sample = null;
  } finally { $("askBtn").disabled = false; $("stopBtn").hidden = true; }
}

// ---------- mode ----------
let mode = "query";
const GR_MONTH = d => { const [y, m, dd] = d.split("-"); return `${+dd} Σεπ ${y}`; };
function setMode(m) {
  mode = m; ["query", "time", "swipe"].forEach(k => $("mode-" + k).setAttribute("aria-pressed", m === k));
  $("swipeUI").hidden = m !== "swipe"; document.querySelector(".layers").hidden = m === "swipe"; $("map2").hidden = m !== "swipe"; $("card").hidden = true; $("tlUI").hidden = m !== "time";
  stopTL();
  if (m === "swipe") {
    TEX_L = composite([{ id: "flood", op: 0.95 }]); TEX_R = composite([{ id: "lake", op: 0.9 }]);
    if (!deck2) deck2 = makeDeck($("map2"), []);
    deck2.setProps({ viewState });
  }
  if (m === "time") setTL(tlIdx);
  redraw(); renderLegend();
}
function setTL(k) {
  tlIdx = k; $("tlRange").value = k; $("tlDate").textContent = GR_MONTH(TL.dates[k]);
  $("tlKm").textContent = fmt(TL.km2[k]) + " km² υπό νερό";
  $("tlAoi").textContent = "Νέες εικόνες: " + (TL.aoi_dates[TL.dates[k]] || []).join(", ");
  redraw();
}
function stopTL() { if (tlPlay) { clearInterval(tlPlay); tlPlay = null; $("tlPlay").textContent = "▶ Αναπαραγωγή"; } }
function playTL() {
  if (tlPlay) { stopTL(); return; }
  $("tlPlay").textContent = "❚❚ Παύση"; if (tlIdx >= TL.dates.length - 1) setTL(0);
  tlPlay = setInterval(() => { if (tlIdx >= TL.dates.length - 1) { stopTL(); return; } setTL(tlIdx + 1); }, 1100);
}
function initSwipe() {
  const dv = $("divider"), st = $("stage");
  const set = x => { const r = st.getBoundingClientRect(); const p = Math.max(5, Math.min(95, (x - r.left) / r.width * 100)); dv.style.left = p + "%"; $("map2").style.clipPath = `inset(0 0 0 ${p}%)`; };
  dv.addEventListener("pointerdown", e => { dv.setPointerCapture(e.pointerId); const mv = ev => set(ev.clientX); dv.addEventListener("pointermove", mv); dv.addEventListener("pointerup", () => dv.removeEventListener("pointermove", mv), { once: true }); });
  dv.addEventListener("keydown", e => { const r = st.getBoundingClientRect(); const cur = parseFloat(dv.style.left || "50"); if (e.key === "ArrowLeft") set(r.left + (cur - 3) / 100 * r.width); if (e.key === "ArrowRight") set(r.left + (cur + 3) / 100 * r.width); });
}
function renderLayersPanel() {
  const P = $("layersList"); P.replaceChildren();
  OV.forEach(o => {
    const r = el("label", "lyr"); const cb = el("input"); cb.type = "checkbox"; cb.checked = o.on; cb.id = "ov-" + o.id;
    cb.onchange = () => { o.on = cb.checked; if (o.kind === "tex") { TEX1 = composite(); renderLayersPanel(); } redraw(); };
    const t = el("span"); t.append(el("span", null, o.l), el("small", null, o.src)); r.append(cb, t);
    if (o.kind === "tex" && o.on) { const s = el("input"); s.type = "range"; s.min = 0.1; s.max = 1; s.step = 0.05; s.value = o.op; s.id = "op-" + o.id; s.setAttribute("aria-label", "Διαφάνεια " + o.l);
      s.oninput = () => { o.op = +s.value; if (o.on) { TEX1 = composite(); redraw(); } }; r.append(s); }
    P.append(r);
  });
}

// ---------- boot ----------
(async function boot() {
  try {
    [D, V, TL] = await Promise.all(["data.json", "assets/vectors.json", "assets/daniel_timeline.json"].map(u => fetch(u).then(r => r.json())));
    const names = ["base", "landcover", "natura", "flood", "lake"], files = ["assets/base.jpg", "assets/ov_landcover.png", "assets/ov_natura.png", "assets/ov_flood.png", "assets/ov_lake.png"];
    (await Promise.all(files.map(loadImg))).forEach((im, k) => IMG[names[k]] = im);
  } catch (e) { $("loading").textContent = "Τα δεδομένα δεν φορτώθηκαν."; return; }
  N = D.h3.length; IDX = [...Array(N).keys()];
  LON = new Float64Array(N); LAT = new Float64Array(N); D.h3.forEach((h, i) => { const [la, lo] = h3.cellToLatLng(h); LAT[i] = la; LON[i] = lo; });
  AREA_TOT = D.area.reduce((a, b) => a + b, 0); POP_TOT = D.pop.reduce((a, b) => a + b, 0);
  $("stats").textContent = `H3 res 8 · ${fmt(N)} κελιά · ${fmt(AREA_TOT)} km² · ${fmt(POP_TOT)} κάτοικοι · 40+ layers`;
  // towns: keep the larger of any two within ~7 km (drops suburbs that collide with their city)
  const big = V.towns.filter(t => (t.p || 0) >= 5000).sort((a, b) => (b.p || 0) - (a.p || 0));
  big.forEach(t => { if (!TOWNS.some(u => Math.hypot((u.x - t.x) * 0.77, u.y - t.y) < 0.065)) TOWNS.push(t); });
  TEX1 = composite();
  const P = $("presets"); PRESETS.forEach(p => { const b = el("button", "chip", p.q); b.onclick = () => { $("q").value = p.q; if (mode !== "query") setMode("query"); apply(structuredClone(p.spec), "preset", true); }; P.append(b); });
  $("tlRange").max = TL.dates.length - 1;
  apply(structuredClone(PRESETS[0].spec), "preset", false);
  deck1 = makeDeck($("map"), queryLayers());
  $("loading").remove(); renderLegend(); renderLayersPanel(); initSwipe();
  if (innerWidth < 820) document.querySelector(".layers").open = false;
  ["query", "time", "swipe"].forEach(k => $("mode-" + k).onclick = () => setMode(k));
  $("exag").oninput = () => { EX = +$("exag").value; $("exagOut").textContent = "×" + fmt(EX, 1); redraw(); };
  $("tlRange").oninput = () => { stopTL(); setTL(+$("tlRange").value); }; $("tlPlay").onclick = playTL;
  $("askBtn").onclick = ask; $("stopBtn").onclick = () => ctl?.abort();
  $("q").addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) ask(); });
  try { sample = await window.claude?.use("sample"); } catch { sample = null; }
  if (!sample) $("status").textContent = "Έτοιμα ερωτήματα · ο ζωντανός agent ανοίγει μέσα στο Claude";
})();

</script>
